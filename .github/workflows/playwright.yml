name: Playwright

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

env:
  MEDUSA_BASE_URL: https://ec-medusa-app.onrender.com

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Wake Medusa
        run: node scripts/wait-for-medusa.mjs

      - name: Run Playwright
        env:
          MEDUSA_PUBLISHABLE_API_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_API_KEY }}
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
